<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="logo/smartbudget-icon.svg" />
    <meta name="theme-color" content="#0f172b" />
    <meta name="description" content="Smart Money, Bright Tomorrow" />
    <link rel="manifest" href="/manifest.json" />
    <title>Welcome | SmartBudget</title>

    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="bg-page dark:bg-dark-page dark:text-dark-heading text-heading">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
